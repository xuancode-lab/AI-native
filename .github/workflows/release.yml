name: Build & Release

# tag v* 触发双平台构建 + GitHub Release；也可在 Actions 页手动触发只构建不发布
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8        # runner 默认 cp1252，中文/emoji 输出会炸
    defaults:
      run:
        working-directory: ai-kms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: 测试门禁（全过才打包）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover tests -v
      - name: 打包 exe
        run: python build.py pyinstaller
      - name: 压成 zip
        shell: pwsh
        run: Compress-Archive -Path dist/AI-Native-KMS/* -DestinationPath AI-Native-KMS-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: win-zip
          path: ai-kms/AI-Native-KMS-win-x64.zip

  build-macos:
    runs-on: macos-14          # Apple Silicon runner
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: ai-kms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: 测试门禁
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover tests -v
      - name: 生成 .icns（make_icons 在 mac 上自动 iconutil）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icons.py
      - name: 打包 .app → DMG
        run: |
          python build.py pyinstaller
          # PyInstaller onedir+windowed 的 .app 位置随版本有差异（dist/ 或 dist/<name>/），
          # 不硬编码——动态定位，找不到就带着 dist 目录列表报错，方便下轮诊断
          APP=$(find dist -maxdepth 2 -type d -name "AI-Native-KMS.app" | head -1)
          if [ -z "$APP" ]; then echo "未找到 .app，dist 内容："; find dist -maxdepth 3 | head -40; exit 1; fi
          echo "APP = $APP"
          codesign --force --deep -s - "$APP"          # ad-hoc 签名（arm64 最低要求）
          # 标准拖拽安装 DMG：.app + Applications 快捷方式
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "AI-Native KMS" \
            -srcfolder "$STAGE" -ov -format UDZO AI-Native-KMS-mac-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: ai-kms/AI-Native-KMS-mac-arm64.dmg

  release:
    # 仅 tag 触发时发布；两个产物都成功才创建
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AI-Native-KMS-win-x64.zip
            AI-Native-KMS-mac-arm64.dmg
          generate_release_notes: true
